<svg xmlns="http://www.w3.org/2000/svg" width="360" height="604" viewBox="0 0 360 604" role="img" aria-labelledby="title description">
  <title id="title">An explicit Send reaches one selected conversation</title>
  <desc id="description">Source conversation, native Send tooling, resolve and pin the destination, provider integration, and selected target conversation. Acceptance and observed delivery are separate.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#126775"/></marker></defs>
  <rect width="360" height="604" rx="8" fill="#f6fafb"/>
  <g fill="#fff" stroke="#126775" stroke-width="2">
    <rect x="28" y="20" width="304" height="72" rx="6"/>
    <rect x="28" y="120" width="304" height="72" rx="6"/>
    <rect x="28" y="220" width="304" height="72" rx="6"/>
    <rect x="28" y="320" width="304" height="72" rx="6"/>
    <rect x="28" y="420" width="304" height="72" rx="6"/>
  </g>
  <g fill="none" stroke="#126775" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 94V114"/><path d="M180 194V214"/><path d="M180 294V314"/><path d="M180 394V414"/>
  </g>
  <g fill="#172c35" font-family="Arial,sans-serif" text-anchor="middle" font-size="18">
    <text x="180" y="62">Source conversation</text>
    <text x="180" y="162">Native Send tool or desktop</text>
    <text x="180" y="262">Resolve and pin the destination</text>
    <text x="180" y="362">Provider route and integration</text>
    <text x="180" y="462">Selected target conversation</text>
    <text x="180" y="530" font-size="16">Local delivery or an authorized</text>
    <text x="180" y="552" font-size="16">remote route</text>
    <text x="180" y="578" font-size="14">Acceptance is not observed target delivery.</text>
  </g>
</svg>
